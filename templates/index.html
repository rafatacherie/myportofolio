<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ name }} - Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="header">
        <a href="{% url 'main:show_main' %}" class="logo"><span>{{ name }}</span></a>

        <i class='bx bx-menu' id="menu-icon"></i>
            
        <nav class="navbar">
            <a href="{% url 'main:show_main' %}" class="active">Profile</a>
            <a href="{% url 'main:show_education' %}">Education</a>
            <a href="{% url 'main:show_experience' %}">Experience</a>
            <a href="{% url 'main:show_skills' %}">Skills</a>
            <a href="{% url 'main:show_contact' %}">Contact</a>
        </nav>

    </header>

    <section class="home" id="home">
        <div class="home-content">
            <h1>Hi, I'm <span>{{ short_name }}</span></h1>
            <h3 class="text-animation">NPM <span></span></h3>
            <p>{{ bio }}</p>

            <div class="social-icons">
                <a href="https://www.linkedin.com/in/rafata-zahi-cherie-894103375"><i class='bx bxl-linkedin'></i></a>
                <a href="https://github.com/rafatacherie"><i class='bx bxl-github'></i></a>
                <a href="https://www.instagram.com/rftazc/"><i class='bx bxl-instagram-alt'></i></a>
            </div>

            <div class="btn-group">
                <a href="#" class="btn">Hire</a>
                <a href="#contact" class="btn">Contact</a>
            </div>
        </div>
            <div class="home-img">
                <img src="/static/img/rafata.png" alt="Photo of {{ name }}">
            </div>
    </section>

    <footer class="footer">
        <div class="social">
            <a href="https://www.linkedin.com/in/rafata-zahi-cherie-894103375"><i class='bx bxl-linkedin'></i></a>
            <a href="https://github.com/rafatacherie"><i class='bx bxl-github'></i></a>
            <a href="https://www.instagram.com/rftazc/"><i class='bx bxl-instagram-alt'></i></a>
        </div>

        <ul class="list">
            <li>
                <a href="{% url 'main:show_main' %}">Profile</a>
            </li>

            <li>
                <a href="{% url 'main:show_education' %}">Education</a>
            </li>

            <li>
                <a href="{% url 'main:show_experience' %}">Experience</a>
            </li>

            <li>
                <a href="{% url 'main:show_skills' %}">Skills</a>
            </li>

            <li>
                <a href="{% url 'main:show_contact' %}">Contact</a>
            </li>
        </ul>

        <p class="copyright">
            &copy; 2026 by {{ name }} | Faculty of Computer Science, Universitas Indonesia.
        </p>
    </footer>

    <script src="/static/js/script.js"></script>
</body>
</html>
