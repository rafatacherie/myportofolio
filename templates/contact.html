{% extends 'base.html' %}
{% block meta %}
    <title>Contact - {{ name }}</title>
{% endblock meta %}
{% block content %}
    <section class="contact" id="contact">
        <h2 class="heading">Contact</h2>

        <div class="contact-buttons">
            {% for contact in contact_list %}
                <a href="mailto:{{ contact.email }}" class="btn">
                    <i class='bx bx-envelope'></i> Send me a message
                </a>
            {% empty %}
                <p class="empty-state">No contact information has been added yet.</p>
            {% endfor %}
        </div>
    </section>
{% endblock content %}
