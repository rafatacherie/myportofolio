<button type="button"
        class="experience-delete-btn"
        popovertarget="delete-experience-{{ experience.id }}"
        aria-label="Hapus {{ experience.title }}"
        title="Hapus pengalaman">
    Delete
</button>
<div id="delete-experience-{{ experience.id }}"
     class="experience-delete-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="delete-experience-title-{{ experience.id }}">
    <button type="button"
            class="experience-delete-modal__backdrop"
            popovertarget="delete-experience-{{ experience.id }}"
            popovertargetaction="hide"
            aria-label="Tutup konfirmasi hapus"></button>
    <div class="experience-delete-modal__content">
        <button type="button"
                class="experience-delete-modal__close"
                popovertarget="delete-experience-{{ experience.id }}"
                popovertargetaction="hide"
                aria-label="Tutup konfirmasi hapus">&times;</button>
        <h3 id="delete-experience-title-{{ experience.id }}">Delete Experience?</h3>
        <p>
            Are you sure you want to delete
            <strong>{{ experience.title }}</strong>?
        </p>
        <div class="experience-delete-modal__actions">
            <button type="button"
                    class="btn btn-secondary"
                    popovertarget="delete-experience-{{ experience.id }}"
                    popovertargetaction="hide">Cancel</button>
            <form method="post" action="{% url 'main:delete_experience' experience.id %}">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Yes, Delete</button>
            </form>
        </div>
    </div>
</div>
